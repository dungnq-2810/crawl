<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eceff3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
<title>Viral Radar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23121016'/%3E%3Crect x='8' y='18' width='3' height='6' rx='1' fill='%23f7a8cb'/%3E%3Crect x='13' y='14' width='3' height='10' rx='1' fill='%23f7a8cb'/%3E%3Crect x='18' y='10' width='3' height='14' rx='1' fill='%23f7a8cb'/%3E%3Crect x='23' y='6' width='3' height='18' rx='1' fill='%23ec3586'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/theme.css">
<script>
  try { const t = localStorage.getItem("vr-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#main">Bỏ qua điều hướng</a>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-explore" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></symbol>
  <symbol id="i-groups" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h6"/></symbol>
  <symbol id="i-watch" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-cart" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 13h12l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.5"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
</svg>

<header class="topbar" id="topbar">
  <a class="logo" href="#/" aria-label="Viral Radar, về trang chủ">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#121016"/><rect x="8" y="18" width="3" height="6" rx="1" fill="#f7a8cb"/><rect x="13" y="14" width="3" height="10" rx="1" fill="#f7a8cb"/><rect x="18" y="10" width="3" height="14" rx="1" fill="#f7a8cb"/><rect x="23" y="6" width="3" height="18" rx="1" fill="#ec3586"/></svg>
    <span>Viral Radar</span>
  </a>
  <form class="topsearch" id="topSearch" role="search" hidden>
    <label class="sr-only" for="topQ">Tìm video viral</label>
    <input id="topQ" type="search" name="q" autocomplete="off" spellcheck="false" placeholder="Tìm chủ đề khác…">
    <button type="submit" class="btn primary">Tìm</button>
  </form>
  <div class="top-actions">
    <a class="btn ghost icon" href="#/settings" id="setBtn" aria-label="Cài đặt" title="Cài đặt"><svg class="i" aria-hidden="true"><use href="#i-settings"/></svg></a>
    <button class="btn ghost icon" id="themeBtn2" type="button" aria-label="Đổi giao diện sáng / tối"><svg class="i" aria-hidden="true"><use href="#i-moon"/></svg></button>
  </div>
</header>

<div class="shell">
  <!-- Điều hướng các khu nâng cao: đang ẩn, vẫn mở được qua #/explore, #/groups, #/watch, #/history, #/settings -->
  <aside class="side" aria-label="Điều hướng chính" hidden>
    <a class="logo" href="#/explore" aria-label="Viral Radar, về trang Khám phá">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--ink)"/><rect x="8" y="18" width="3" height="6" rx="1" fill="#c4b8ff"/><rect x="13" y="14" width="3" height="10" rx="1" fill="#c4b8ff"/><rect x="18" y="10" width="3" height="14" rx="1" fill="#c4b8ff"/><rect x="23" y="6" width="3" height="18" rx="1" fill="var(--signal)"/></svg>
      Viral Radar
    </a>
    <nav class="nav" aria-label="Các khu">
      <a href="#/explore" data-page="explore"><svg class="i" aria-hidden="true"><use href="#i-explore"/></svg>Khám phá<span class="count num" id="navCount"></span></a>
      <a href="#/groups" data-page="groups"><svg class="i" aria-hidden="true"><use href="#i-groups"/></svg>Nhóm theo</a>
      <a href="#/watch" data-page="watch"><svg class="i" aria-hidden="true"><use href="#i-watch"/></svg>Theo dõi<span class="count num" id="watchCount"></span></a>
      <a href="#/history" data-page="history"><svg class="i" aria-hidden="true"><use href="#i-history"/></svg>Lịch sử quét</a>
      <a href="#/settings" data-page="settings" class="desk"><svg class="i" aria-hidden="true"><use href="#i-settings"/></svg>Cài đặt</a>
    </nav>
    <div class="side-foot">
      <a class="jobmini" id="jobMini" href="#/history" aria-live="polite"></a>
      <button class="theme-btn" id="themeBtn" type="button"><svg class="i" aria-hidden="true"><use href="#i-moon"/></svg><span>Giao diện tối</span></button>
    </div>
  </aside>

  <main id="main" tabindex="-1"></main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden></aside>
<div class="tip" id="tip" role="tooltip"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/static/app.js"></script>
</body>
</html>
